<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Asuransi Kesehatan - InsureCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html">InsureCare</a>
        </div>

        <div class="nav-menu">
            <a href="index.html">Home</a>
            <a href="index.html#produk">Produk</a>
        </div>
    </nav>

    <section class="detail-produk">

        <div class="detail-container">

            <div class="detail-content">

                <p class="jenis-produk">PEMBELIAN ASURANSI KESEHATAN</p>

                <h1>Data Pemegang Asuransi</h1>

                <form id="formKesehatan">

                    <label>Nama Lengkap</label>
                    <input type="text" id="nama" required>

                    <label>Tanggal Lahir</label>
                    <input type="date" id="tanggalLahir" required>

                    <label>Pekerjaan</label>
                    <input type="text" id="pekerjaan" required>

                    <label>Apakah Anda Merokok?</label>
                    <select id="merokok" required>
                        <option value="">-- Pilih --</option>
                        <option value="ya">Ya</option>
                        <option value="tidak">Tidak</option>
                    </select>

                    <label>Apakah Anda Memiliki Hipertensi?</label>
                    <select id="hipertensi" required>
                        <option value="">-- Pilih --</option>
                        <option value="ya">Ya</option>
                        <option value="tidak">Tidak</option>
                    </select>

                    <label>Apakah Anda Memiliki Diabetes?</label>
                    <select id="diabetes" required>
                        <option value="">-- Pilih --</option>
                        <option value="ya">Ya</option>
                        <option value="tidak">Tidak</option>
                    </select>

                    <button type="submit" class="beli-btn">
                        Hitung Premi
                    </button>

                </form>

                <div id="hasilPremi"></div>

            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 InsureCare - Marketplace Asuransi</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
