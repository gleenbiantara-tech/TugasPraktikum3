<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Asuransi Jiwa - InsureCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html">InsureCare</a>
        </div>

        <div class="nav-menu">
            <a href="index.html">Home</a>
            <a href="index.html#produk">Produk</a>
        </div>
    </nav>

    <section class="detail-produk">
        <div class="detail-container">
            <div class="detail-content">

                <p class="jenis-produk">PEMBELIAN ASURANSI JIWA</p>

                <h1>Data Pemegang Asuransi</h1>

                <form id="formJiwa">

                    <label>Nama Lengkap</label>
                    <input type="text" id="namaJiwa" required>

                    <label>Tanggal Lahir</label>
                    <input type="date" id="tanggalLahirJiwa" required>

                    <label>Jumlah Pertanggungan</label>
                    <select id="pertanggungan" required>
                        <option value="">-- Pilih Jumlah Pertanggungan --</option>
                        <option value="1000000000">Rp 1.000.000.000</option>
                        <option value="2000000000">Rp 2.000.000.000</option>
                        <option value="3500000000">Rp 3.500.000.000</option>
                        <option value="5000000000">Rp 5.000.000.000</option>
                        <option value="10000000000">Rp 10.000.000.000</option>
                    </select>

                    <br><br>

                    <button type="submit" class="beli-btn">
                        Hitung Premi
                    </button>

                </form>

                <div id="hasilPremiJiwa"></div>

            </div>
        </div>
    </section>

    <footer>
        <p>© 2026 InsureCare - Marketplace Asuransi</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
