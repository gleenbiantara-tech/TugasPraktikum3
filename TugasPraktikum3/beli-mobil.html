<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beli Asuransi Mobil - InsureCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html">InsureCare</a>
        </div>

        <div class="nav-menu">
            <a href="index.html">Home</a>
            <a href="index.html#produk">Produk</a>
        </div>
    </nav>

    <section class="detail-produk">

        <div class="detail-container">

            <div class="detail-content">

                <p class="jenis-produk">PEMBELIAN ASURANSI MOBIL</p>

                <h1>Data Kendaraan</h1>

                <form id="formMobil">

                    <label>Merek / Tipe Mobil</label>
                    <input type="text" id="merkMobil" required>

                    <label>Tahun Mobil</label>
                    <input type="number" id="tahunMobil" required>

                    <label>Harga Mobil</label>
                    <input type="number" id="hargaMobil" required>

                    <label>Nomor Polisi</label>
                    <input type="text" id="nomorPolisi" required>

                    <label>Nomor Mesin</label>
                    <input type="text" id="nomorMesin" required>

                    <label>Nomor Rangka</label>
                    <input type="text" id="nomorRangka" required>

                    <label>Nama Pemilik</label>
                    <input type="text" id="namaPemilik" required>

                    <br>

                    <h3>Foto Kendaraan</h3>

                    <label>Foto Tampak Depan</label>
                    <input type="file" required>

                    <label>Foto Tampak Belakang</label>
                    <input type="file" required>

                    <label>Foto Tampak Kiri</label>
                    <input type="file" required>

                    <label>Foto Tampak Kanan</label>
                    <input type="file" required>

                    <label>Foto Dashboard</label>
                    <input type="file" required>

                    <label>Foto Mesin</label>
                    <input type="file" required>

                    <button type="submit" class="beli-btn">
                        Hitung Premi
                    </button>

                </form>

                <div id="hasilPremiMobil"></div>

            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 InsureCare - Marketplace Asuransi</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
